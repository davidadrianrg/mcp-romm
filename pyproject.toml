[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-romm"
version = "1.4.1"
description = "MCP server for RomM — browse and manage your retro game library with AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
romm-mcp = "server:mcp.run"

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Bare `pytest` runs the unit suite only. smoke_test.py is a live end-to-end
# script (needs a running RomM instance + credentials) and is invoked directly
# with `python smoke_test.py`; its test_* helpers are not collectable fixtures.
testpaths = ["test_server.py"]

[tool.ruff.lint]
# Pin the classic default rule set explicitly. Newer ruff releases started
# flagging long-standing, deliberate patterns in this codebase (broad excepts
# in the token/request fallbacks, numeric unions, noqa placement) that this
# project never opted into; the explicit selection keeps `ruff check .`
# deterministic across ruff versions instead of drifting with its defaults.
select = ["E4", "E7", "E9", "F"]
